services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: iotdb
    ports:
      - "5557:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: .
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:devpass@db:5432/iotdb
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_BACKEND_URL: redis://redis:6379/0
    restart: on-failure

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --pool=solo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:devpass@db:5432/iotdb
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_BACKEND_URL: redis://redis:6379/0
    restart: on-failure